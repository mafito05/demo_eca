# `$connection_upgrade` no viene definida en la imagen base: hay que derivarla de la cabecera
# `Upgrade` del cliente. Vale "upgrade" en un handshake de WebSocket y "close" en el resto, que
# es lo que evita que una petición HTTP normal se anuncie como si quisiera cambiar de protocolo.
# Este fichero se incluye dentro del bloque `http`, así que `map` es válido aquí.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip solo sobre texto: los .ts de video y las imágenes ya vienen comprimidos y
    # recomprimirlos gasta CPU sin ganar bytes.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular es una SPA con rutas del lado del cliente: cualquier ruta desconocida tiene que
    # devolver index.html o un F5 sobre /machines daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros con hash en el nombre (outputHashing: all) son inmutables; index.html no,
    # o el navegador seguiría pidiendo un bundle que ya no existe tras un despliegue.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- Descarga del APK ----------------------------------------------------
    # El APK compilado se monta aqui desde mobile/build (ver docker-compose.yml). Es lo que
    # evita tener que pasar 170 MB por scp para instalarlo en un telefono: se abre
    # http://IP/download/app-debug.apk desde el navegador del propio dispositivo.
    #
    # El `Content-Type` es obligatorio: servido como application/octet-stream, Android guarda
    # el fichero pero no ofrece instalarlo. Si no se quiere publicar el binario, basta con
    # quitar el volumen del compose — este bloque devolvera 404.
    location /download/ {
        alias /usr/share/nginx/html/download/;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="demoeca.apk"';
        # Sin listado de directorio: se sirve lo que se pide por nombre, no un indice.
        autoindex off;
    }

    # --- API + WebSocket del agente ------------------------------------------
    # Equivalente en servidor de `proxy.conf.json`. El bloque cubre las dos cosas porque el
    # WebSocket vive bajo el mismo prefijo (/api/v1/agent/ws): las cabeceras de Upgrade se
    # mandan siempre y `$connection_upgrade` las neutraliza en las peticiones HTTP normales.
    #
    # `^~` no es decorativo: sin el, una location por regex gana a una por prefijo, y el bloque
    # de cacheo de estaticos de arriba (que termina en .png) se quedaba con
    # /api/v1/machines/{id}/qr.png y devolvia el 404 de Nginx en lugar del QR del backend.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # El agente emite la respuesta token a token; con buffering el usuario vería la
        # respuesta aparecer de golpe al final.
        proxy_buffering off;

        # El streaming del LLM y la subida de un mp4 tardan más que el minuto por defecto.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2g;
    }

    # Sondas de salud del backend, útiles para comprobar el stack desde fuera sin abrir :8000.
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
